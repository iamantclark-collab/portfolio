  /* Pieces with no link yet: a plain div, not clickable, but keeps the hover swap */
  .work .no-link { display: block; cursor: default; }
  @media (hover: hover) {
    .work .no-link:hover .alt { opacity: 1; }
  }

  /* Back to top button: fixed bottom right, fades in after scrolling */
  .to-top {
    position: fixed;
    right: clamp(16px, 3vw, 32px);
    bottom: calc(clamp(16px, 3vw, 32px) + env(safe-area-inset-bottom, 0px));
    width: 56px;
    height: 56px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid var(--ink);
    border-radius: 50%;
    background: var(--ink);
    color: var(--bg);
    cursor: pointer;
    z-index: 100;
    opacity: 0;
    visibility: hidden;
    transform: translateY(8px);
    transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s, background 0.2s ease, color 0.2s ease;
  }
  .to-top.visible { opacity: 1; visibility: visible; transform: none; }
  .to-top:hover { background: var(--bg); color: var(--ink); }
  .to-top:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .to-top svg { width: 28px; height: 28px; fill: currentColor; }
  @media (prefers-reduced-motion: reduce) {
    .to-top { transition: none; }
  }

  /* Animated pieces: a live SVG layer sits on top of the static poster image,
     and the hover image sits on top of both, so the hover swap works as before */
  .frame[data-animated] { position: relative; overflow: hidden; }
  .frame[data-animated] .anim {
    position: absolute; inset: 0; z-index: 1;
    opacity: 0; transition: opacity 0.5s ease; pointer-events: none;
  }
  .frame[data-animated] .anim.ready { opacity: 1; }
  .frame[data-animated] .anim svg { display: block; width: 100%; height: 100%; }
  .frame[data-animated] .alt { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 2; }
  @media (prefers-reduced-motion: reduce) {
    .frame[data-animated] .anim { display: none; }
  }

  /* ---------- Loader overlay ---------- */
  html.is-loading { overflow: hidden; }
  .loader {
    position: fixed; inset: 0; z-index: 9999;
    display: flex; align-items: center; justify-content: center;
    background: var(--ink, #F5F87C);                         /* yellow */
    transition: transform 0.9s cubic-bezier(0.77, 0, 0.18, 1);
    /* failsafe: if the script never finishes, the overlay still leaves after 20s */
    animation: loader-failsafe 0.01s linear 20s forwards;
  }
  .loader.is-done { transform: translateY(-100%); }          /* swipes off the top */
  /* the logo is recoloured to solid grey whatever colour the file is (alpha/shape is kept) */
  .loader-logo {
    width: clamp(160px, 12vw, 200px);
    animation: fade 0.5s ease-in-out;
  }
  .loader-logo img { display: block; width: 100%; height: auto; filter: url(#loader-grey); }
  @keyframes loader-blink { 0%, 45% { opacity: 1; } 55%, 90% { opacity: 0.08; } 100% { opacity: 1; } }
  @keyframes loader-failsafe { to { transform: translateY(-100%); visibility: hidden; } }
  @media (prefers-reduced-motion: reduce) {
    .loader { transition: opacity 0.4s ease; animation: none; }
    .loader.is-done { transform: none; opacity: 0; }
    .loader-logo { animation: none; }
  }

/* ---------- Rendering ---------- */

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"

}

/* ---------- Animated pieces ---------- */

function makeRig(svg) {

  if (!svg) {
    throw new Error("Could not find SVG element.");
  }

  const q = s => svg.querySelector(s);
  const qa = s => [...svg.querySelectorAll(s)];

  const el = {
    chest: q("#ez-chest"),
    head: q("#ez-head"),
    hat: q("#ez-hat"),
    collars: qa(".ez-collar"),
    pins: qa(".ez-pin"),
    feats: ["#ez-nose", "#ez-mouth", "#ez-stache", "#ez-glasses"].map(q)
  };

  // Check that the main animated SVG elements exist
  if (!el.chest || !el.head) {
    console.warn("Animation elements missing: check SVG IDs #ez-chest and #ez-head.");
  }

  const CFG = {
    headTurn: 5,
    headShift: 22,
    featureShift: 6,
    hatShift: 0,
    breathe: 0.85,
    breathPeriod: 4.6,
    look: 0.9
  };

  const PIV = { x: 1300, y: 2843 };
  const PA = { x: -340, y: 3312 };
  const PB = { x: 830, y: 2673 };

  const PL = Math.hypot(PB.x - PA.x, PB.y - PA.y);
  const PE = {
    x: (PB.x - PA.x) / PL,
    y: (PB.y - PA.y) / PL
  };

  const T = (n, s) => {
    if (n) n.setAttribute("transform", s);
  };

  const ease = p => p * p * (3 - 2 * p);

  let raf = 0;
  let running = false;
  let t0 = performance.now();

  function frame(now) {

    const t = (now - t0) / 1000;

    const x = (
      Math.sin(t * 0.5) +
      0.35 * Math.sin(t * 1.3 + 2)
    ) * 0.6 * CFG.look;

    const y = (
      Math.sin(t * 0.37 + 1) +
      0.3 * Math.sin(t * 0.9)
    ) * 0.3 * CFG.look;

    const w = (Math.PI * 2) / CFG.breathPeriod;
    const B = CFG.breathe;

    const chest = ease((Math.sin(t * w) + 1) / 2);
    const headB = ease((Math.sin(t * w - 0.7) + 1) / 2);

    const sy = 1 + 0.007 * chest * B;
    const sx = 1 + 0.004 * chest * B;

    T(
      el.chest,
      `translate(0 ${-3 * chest * B})
       translate(1300 3508)
       scale(${sx} ${sy})
       translate(-1300 -3508)`
    );

    const hx = x * CFG.headShift;
    const hy = y * 8 - 1.5 * headB * B;

    const rot =
      x * CFG.headTurn +
      Math.sin(t * w - 0.7) * 0.3 * B;

    const headT =
      `translate(${hx} ${hy})
       rotate(${rot} ${PIV.x} ${PIV.y})`;

    T(el.head, headT);

    el.collars.forEach(c => T(c, headT));

    const rr = rot * Math.PI / 180;
    const bx = PB.x - PIV.x;
    const by = PB.y - PIV.y;

    const dX =
      PIV.x +
      bx * Math.cos(rr) -
      by * Math.sin(rr) +
      hx - PB.x;

    const dY =
      PIV.y +
      bx * Math.sin(rr) +
      by * Math.cos(rr) +
      hy - PB.y;

    const m11 = 1 + dX * PE.x / PL;
    const m21 = dY * PE.x / PL;
    const m12 = dX * PE.y / PL;
    const m22 = 1 + dY * PE.y / PL;

    const pinT =
      `matrix(${m11} ${m21} ${m12} ${m22}
      ${PA.x - (m11 * PA.x + m12 * PA.y)}
      ${PA.y - (m21 * PA.x + m22 * PA.y)})`;

    el.pins.forEach(p => T(p, pinT));

    el.feats.forEach(f => {
      if (f) {
        T(f, `translate(${x * CFG.featureShift} ${y * 6})`);
      }
    });

    T(el.hat, `translate(${x * CFG.hatShift} 0)`);

    if (running) {
      raf = requestAnimationFrame(frame);
    }
  }

  return {

    start() {
      if (!running) {
        running = true;
        t0 = performance.now();
        raf = requestAnimationFrame(frame);
      }
    },

    stop() {
      running = false;
      cancelAnimationFrame(raf);
    }

  };
}


/* Find all illustrations that have animated SVGs */

document.querySelectorAll(".frame[data-animated]").forEach(frame => {

  const layer = frame.querySelector(".anim");

  if (!layer) {
    console.error("Animation layer missing:", frame);
    return;
  }

  if (!motionOK) return;

  let rig = null;
  let loading = false;
  let visible = false;

  async function load() {

    if (loading || rig) return;

    loading = true;

    try {

      const svgPath = frame.dataset.animated;

      const response = await fetch(svgPath, {
        cache: "no-cache"
      });

      if (!response.ok) {
        throw new Error(
          `SVG failed to load: ${response.status} ${response.statusText}`
        );
      }

      const svgText = await response.text();

      // Insert the SVG into the animation layer
      layer.innerHTML = svgText;

      const svg = layer.querySelector("svg");

      if (!svg) {
        throw new Error("The loaded file does not contain an SVG element.");
      }

      // Make the SVG scale correctly inside the image frame
      svg.setAttribute("width", "100%");
      svg.setAttribute("height", "100%");

      rig = makeRig(svg);

      layer.classList.add("ready");

      if (visible) {
        rig.start();
      }

    } catch (error) {

      console.error(
        "Could not initialise animated illustration:",
        frame.dataset.animated,
        error
      );

    } finally {

      loading = false;

    }

  }


  // Load only when the illustration approaches the viewport

  if ("IntersectionObserver" in window) {

    const observer = new IntersectionObserver(entries => {

      visible = entries[0].isIntersecting;

      if (visible && !rig) {
        load();
      }

      if (rig) {
        visible ? rig.start() : rig.stop();
      }

    }, {
      rootMargin: "300px"
    });

    observer.observe(frame);

  } else {

    // Fallback for browsers without IntersectionObserver
    visible = true;
    load();

  }

});

function ph(color, label) {

  return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
}

<script>
/* ---------- Loader overlay: waits for fonts + images, then swipes off the top ---------- */
(() => {
  const loader = document.getElementById("loader");
  if (!loader) return;

  const MIN_SHOW = 1200;             // ms: the blinking logo is always on screen at least this long
  const MAX_WAIT = 15000;            // ms: never hold the page longer than this, whatever happens
  const WAIT_FOR_ALL_IMAGES = true;  // false = only wait for images near the top of the page

  // 1) every image, including the lazy ones and the hover versions
  let imgs = [...document.images].filter(img => !loader.contains(img));
  if (WAIT_FOR_ALL_IMAGES) imgs.forEach(img => { img.loading = "eager"; });
  else imgs = imgs.filter(img => img.getBoundingClientRect().top < innerHeight * 1.5);
  const settle = img => new Promise(done => {
    if (img.complete) return done();                       // already loaded (or failed)
    img.addEventListener("load", done, { once: true });
    img.addEventListener("error", done, { once: true });   // a missing image never blocks the page
  });

  // 2) the page itself (stylesheets, scripts) and both Gilroy weights
  const pageLoaded = document.readyState === "complete"
    ? Promise.resolve()
    : new Promise(done => addEventListener("load", done, { once: true }));
  const fontsReady = document.fonts
    ? Promise.all([document.fonts.load("300 1em Gilroy"), document.fonts.load("800 1em Gilroy")])
        .catch(() => {}).then(() => document.fonts.ready)
    : Promise.resolve();

  let revealed = false;
  function reveal() {
    if (revealed) return;
    revealed = true;
    document.documentElement.classList.remove("is-loading");   // scrolling comes back
    loader.classList.add("is-done");                           // swipe up
    loader.addEventListener("transitionend", e => { if (e.target === loader) loader.remove(); });
    setTimeout(() => loader.remove(), 1500);                   // backup removal
  }

  Promise.race([
    Promise.all([pageLoaded, fontsReady, ...imgs.map(settle)]),
    new Promise(done => setTimeout(done, MAX_WAIT))
  ]).then(() => setTimeout(reveal, Math.max(0, MIN_SHOW - performance.now())));
})();
</script>
</body>
</html>
