<style>
  /* Pieces with no link yet: a plain div, not clickable, but keeps the hover swap */
  .work .no-link { display: block; cursor: default; }
  @media (hover: hover) {
    .work .no-link:hover .alt { opacity: 1; }
  }

  /* Back to top button: fixed bottom right, fades in after scrolling */
  .to-top {
    position: fixed;
    right: clamp(16px, 3vw, 32px);
    bottom: calc(clamp(16px, 3vw, 32px) + env(safe-area-inset-bottom, 0px));
    width: 56px;
    height: 56px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid var(--ink);
    border-radius: 50%;
    background: var(--ink);
    color: var(--bg);
    cursor: pointer;
    z-index: 100;
    opacity: 0;
    visibility: hidden;
    transform: translateY(8px);
    transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s, background 0.2s ease, color 0.2s ease;
  }
  .to-top.visible { opacity: 1; visibility: visible; transform: none; }
  .to-top:hover { background: var(--bg); color: var(--ink); }
  .to-top:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .to-top svg { width: 28px; height: 28px; fill: currentColor; }
  @media (prefers-reduced-motion: reduce) {
    .to-top { transition: none; }
  }

  /* Animated pieces: a live SVG layer sits on top of the static poster image,
     and the hover image sits on top of both, so the hover swap works as before */
  .frame[data-animated] { position: relative; overflow: hidden; }
  .frame[data-animated] .anim {
    position: absolute; inset: 0; z-index: 1;
    opacity: 0; transition: opacity 0.5s ease; pointer-events: none;
  }
  .frame[data-animated] .anim.ready { opacity: 1; }
  .frame[data-animated] .anim svg { display: block; width: 100%; height: 100%; }
  .frame[data-animated] .alt { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 2; }
  @media (prefers-reduced-motion: reduce) {
    .frame[data-animated] .anim { display: none; }
  }
</style>

<script>

           is not clickable and the hover effect still works.
           Add a real URL later and it becomes a link.
   src   : the main image
   hover : the second version, shown on hover
   animated : optional, an animated SVG (e.g. "images/animated/eazy.svg").
           It plays on top of src, which stays as the still poster
           (shown while it loads, and for visitors who prefer reduced motion).
           The hover image still swaps in over the top.
   ratio : optional, the image shape as "width / height"
           (e.g. "1 / 1", "4 / 5", "16 / 9"). Default is "4 / 5".
           Both layouts keep every image at its own ratio.

  { title: "Champ19ns",  link: "#", src: "images/grid/champ19ns.jpg", hover:  "images/grid/champ19ns2.jpg", ratio: "4 / 2.8" },

    { title: "Roberto Baggio", link: "#", src: "images/grid/baggio.jpg", hover: "images/grid/baggio2.jpg", ratio: "4 / 2.8" },
  { title: "Iron Mike",  link: "#", src: "images/grid/tyson.jpg", hover: "images/grid/tyson2.jpg", ratio: "4 / 4" },

    { title: "Cantona",  link: "#", src: "images/grid/seagulls.jpg", hover: "images/grid/seagulls2.jpg", ratio: "4 / 4" },
    { title: "Superman",   link: "#", src: "images/grid/supes.png", hover: "images/grid/supes2.jpg", ratio: "4 / 5" },
     { title: "Max",  link: "#", src: "images/grid/st.jpg", hover: "images/grid/max2.jpg", ratio: "4 / 4" },
         { title: "Kampion", link: "#", src: "images/grid/rush.jpg", hover: "images/grid/rush2.jpg", ratio: "4 / 2.8" },
          { title: "Arnie",  link: "#", src: "images/grid/arnie.jpg", hover: "images/grid/arnie2.jpg", ratio: "4 / 4" },

    { title: "The online Football fan",  link: "#", src: "images/grid/pk.jpg", hover: "images/grid/pk2.jpg", ratio: "4 / 2.8" },

          { title: "McClane",  link: "#", src: "images/grid/willis.jpg", hover: "images/grid/willis2.jpg", ratio: "4 / 4" },

      { title: "Dustin",   link: "#", src: "images/grid/st2.jpg", hover:"images/grid/st22.jpg", ratio: "4 / 5" },
        { title: "Steve - Upside down",  link: "#", src: "images/grid/st3.jpg", hover:  "images/grid/st32.jpg", ratio: "4 / 4" },
               { title: "Do not feed the bears",  link: "#", src: "images/grid/bear.jpg", hover:  "images/grid/bear2.jpg", ratio: "4 / 4" },
                   { title: "Rugby",   link: "#", src: "images/grid/rugby.jpg", hover: "images/grid/rugby2.jpg", ratio: "2.5 / 3.5" },
                          { title: "Hot Rod",   link: "#", src: "images/grid/hotrod.jpg", hover: "images/grid/hotrod2.jpg", ratio: "4 / 4" },

/* ---------- Rendering (no need to edit below) ---------- */
const grid = document.getElementById("grid");

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// A link is only real if it's not empty or "#"
function hasLink(l) {
  return typeof l === "string" && l.trim() !== "" && l.trim() !== "#";
}

grid.innerHTML = works.map(w => {
  const inner = `
      <div class="frame" style="--ratio:${esc(w.ratio || "4 / 5")}"${w.animated ? ` data-animated="${esc(w.animated)}"` : ""}>
        <img src="${esc(w.src)}" alt="${esc(w.title)}" loading="lazy" draggable="false">
        ${w.animated ? '<div class="anim" aria-hidden="true"></div>' : ""}
        <img class="alt" src="${esc(w.hover)}" alt="" loading="lazy" draggable="false">
      </div>
      <h2>${esc(w.title)}</h2>`;

  return hasLink(w.link)
    ? `<article class="work"><a href="${esc(w.link)}">${inner}</a></article>`
    : `<article class="work"><div class="no-link">${inner}</div></article>`;
}).join("");

/* ---------- Back to top button ---------- */
const toTop = document.getElementById("toTop");

function updateToTop() {
  toTop.classList.toggle("visible", window.scrollY > 400);
}

window.addEventListener("scroll", updateToTop, { passive: true });
updateToTop();

toTop.addEventListener("click", () => {
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  window.scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" });
});

/* ---------- Layout switch ---------- */
const buttons = document.querySelectorAll(".switch button");

function setLayout(layout) {
  grid.dataset.layout = layout;
  buttons.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.layout === layout)));
  try { localStorage.setItem("portfolio-layout", layout); } catch (e) {}
}

buttons.forEach(b => b.addEventListener("click", () => setLayout(b.dataset.layout)));

// Remember the visitor's last choice
try {
  const saved = localStorage.getItem("portfolio-layout");
  if (saved === "offgrid" || saved === "mosaic") setLayout(saved);
} catch (e) {}

/* ---------- Animated pieces (idle animation only, no cursor tracking) ---------- */
const motionOK = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function makeRig(svg) {
  const q = s => svg.querySelector(s), qa = s => [...svg.querySelectorAll(s)];
  const el = {
    chest: q("#ez-chest"), head: q("#ez-head"), hat: q("#ez-hat"),
    collars: qa(".ez-collar"), pins: qa(".ez-pin"),
    feats: ["#ez-nose", "#ez-mouth", "#ez-stache", "#ez-glasses"].map(q)
  };
  /* tweak these */
  const CFG = {
    headTurn: 5,         // degrees of head tilt while looking around
    headShift: 22,       // how far the head slides while looking around
    featureShift: 10,     // extra shift for glasses / nose / mouth (bigger = more 3D turn, but gaps can open)
    hatShift: 0,         // extra shift for the hat (0 = hat stays rigid with the head)
    breathe: 0.85,       // breathing strength: 0 = off, 1 = noticeable (how far the figure rises)
    breathPeriod: 4.6,   // seconds per breath
    look: 0.9            // how far the slow look-around goes (0-1)
  };
  const PIV = { x: 1300, y: 2843 };                       // base of the neck
  const PA = { x: -340, y: 3312 }, PB = { x: 830, y: 2673 }; // shoulder end -> collar end (shine pin)
  const PL = Math.hypot(PB.x - PA.x, PB.y - PA.y), PE = { x: (PB.x - PA.x) / PL, y: (PB.y - PA.y) / PL };
  const T = (n, s) => n && n.setAttribute("transform", s);
  const ease = p => p * p * (3 - 2 * p);
  let raf = 0, running = false, t0 = performance.now();

  function frame(now) {
    const t = (now - t0) / 1000;
    // slow look-around, always on
    const x = (Math.sin(t * 0.5) + 0.35 * Math.sin(t * 1.3 + 2)) * 0.6 * CFG.look;
    const y = (Math.sin(t * 0.37 + 1) + 0.3 * Math.sin(t * 0.9)) * 0.3 * CFG.look;
    // breathing: shoulders, collar, neck and head rise together, head a beat behind
    const w = (Math.PI * 2) / CFG.breathPeriod, B = CFG.breathe;
    const chest = ease((Math.sin(t * w) + 1) / 2), headB = ease((Math.sin(t * w - 0.7) + 1) / 2);
    const sy = 1 + 0.007 * chest * B, sx = 1 + 0.004 * chest * B;
    T(el.chest, `translate(0 ${-3 * chest * B}) translate(1300 3508) scale(${sx} ${sy}) translate(-1300 -3508)`);
    // head + neck + collar share one transform, so the collar never separates from the neck
    const hx = x * CFG.headShift, hy = y * 8 - 1.5 * headB * B;
    const rot = x * CFG.headTurn + Math.sin(t * w - 0.7) * 0.3 * B;
    const headT = `translate(${hx} ${hy}) rotate(${rot} ${PIV.x} ${PIV.y})`;
    T(el.head, headT);
    el.collars.forEach(c => T(c, headT));
    // shoulder shine + left stripe pinned to the collar end, anchored at the far shoulder end
    const rr = rot * Math.PI / 180, bx = PB.x - PIV.x, by = PB.y - PIV.y;
    const dX = PIV.x + bx * Math.cos(rr) - by * Math.sin(rr) + hx - PB.x;
    const dY = PIV.y + bx * Math.sin(rr) + by * Math.cos(rr) + hy - PB.y;
    const m11 = 1 + dX * PE.x / PL, m21 = dY * PE.x / PL, m12 = dX * PE.y / PL, m22 = 1 + dY * PE.y / PL;
    const pinT = `matrix(${m11} ${m21} ${m12} ${m22} ${PA.x - (m11 * PA.x + m12 * PA.y)} ${PA.y - (m21 * PA.x + m22 * PA.y)})`;
    el.pins.forEach(p => T(p, pinT));
    // face features shift a little further than the head outline
    el.feats.forEach(f => T(f, `translate(${x * CFG.featureShift} ${y * 6})`));
    T(el.hat, `translate(${x * CFG.hatShift} 0)`);
    if (running) raf = requestAnimationFrame(frame);
  }
  return {
    start() { if (!running) { running = true; raf = requestAnimationFrame(frame); } },
    stop() { running = false; cancelAnimationFrame(raf); }
  };
}

document.querySelectorAll(".frame[data-animated]").forEach(frame => {
  if (!motionOK) return;                       // reduced motion: keep the still poster
  const layer = frame.querySelector(".anim");
  let rig = null, loading = false, visible = false;

  async function load() {
    loading = true;
    try {
      const res = await fetch(frame.dataset.animated);
      if (!res.ok) throw new Error(res.status);
      layer.innerHTML = await res.text();
      rig = makeRig(layer.querySelector("svg"));
      layer.classList.add("ready");
      if (visible) rig.start();
    } catch (e) { /* the still poster stays, nothing breaks */ }
  }

  // Only fetch when the piece is near the screen, and only animate while it is visible
  new IntersectionObserver(entries => {
    visible = entries[0].isIntersecting;
    if (visible && !rig && !loading) load();
    if (rig) visible ? rig.start() : rig.stop();
  }, { rootMargin: "300px" }).observe(frame);
});

/* Placeholder image generator, used only for the sample entries */
function ph(color, label) {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500"><rect width="400" height="500" fill="${color}"/><text x="200" y="260" font-family="sans-serif" font-size="64" text-anchor="middle" fill="rgba(0,0,0,.35)">${label}</text></svg>`;
  return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
}
</script>
