<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diverse Pixels - Illustration work of Ant Clark</title>
  <link rel="stylesheet" href="diverse.css">
    <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* Pieces with no link yet: a plain div, not clickable, but keeps the hover swap */
  .work .no-link { display: block; cursor: default; }
  @media (hover: hover) {
    .work .no-link:hover .alt { opacity: 1; }
  }

  /* Back to top button: fixed bottom right, fades in after scrolling */
  .to-top {
    position: fixed;
    right: clamp(16px, 3vw, 32px);
    bottom: calc(clamp(16px, 3vw, 32px) + env(safe-area-inset-bottom, 0px));
    width: 56px;
    height: 56px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid var(--ink);
    border-radius: 50%;
    background: var(--ink);
    color: var(--bg);
    cursor: pointer;
    z-index: 100;
    opacity: 0;
    visibility: hidden;
    transform: translateY(8px);
    transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s, background 0.2s ease, color 0.2s ease;
  }
  .to-top.visible { opacity: 1; visibility: visible; transform: none; }
  .to-top:hover { background: var(--bg); color: var(--ink); }
  .to-top:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .to-top svg { width: 28px; height: 28px; fill: currentColor; }
  @media (prefers-reduced-motion: reduce) {
    .to-top { transition: none; }
  }
</style>

</head>
<body>

<header class="site-header"><div class="container nav">
  <a class="brand" href="index.html"><img class="logo" src="images/logo2.svg" alt="DiversePixels"></a>
  <nav class="nav"> <button class="button" type="button" disabled>Shop: coming soon</button><a class="button secondary"  href="index.html">Contact me</a></nav></div>
<div class="container">
 
 <h1>From Pencil to Pixel, Digital Art with Personality.</h1>

  <div class="switch" role="group" aria-label="Layout">
    <button type="button" data-layout="offgrid" aria-pressed="true">Editorial view</button>
    <button type="button" data-layout="mosaic" aria-pressed="false">Grid view</button>
  </div>
      </div>
</header>

<main class="grid" id="grid" data-layout="offgrid"></main>

<footer class="site-footer">
  <div class="container about">
    <h2>Thanks for viewing!</h2>
    <p>Shop coming soon. If you are interested in any of my work please contact me.</p>
      <a class="button secondary"  href="index.html">Contact me</a>
  </div>
    <img src="images/pencil.svg" alt="">
</footer>

<button type="button" class="to-top" id="toTop" aria-label="Back to top">
  <svg viewBox="0 -960 960 960" aria-hidden="true"><path d="M440-160v-487L216-423l-56-57 320-320 320 320-56 57-224-224v487h-80Z"/></svg>
</button>

<script>
/* =========================================================
   ADD YOUR WORK HERE
   One object per piece. The order here is the order on the page.

   title : text shown under the image
   link  : where the image goes when clicked.
           Use "#" (or leave empty) for no link yet: the piece
           is not clickable and the hover effect still works.
           Add a real URL later and it becomes a link.
   src   : the main image
   hover : the second version, shown on hover
   ratio : optional, the image shape as "width / height"
           (e.g. "1 / 1", "4 / 5", "16 / 9"). Default is "4 / 5".
           Both layouts keep every image at its own ratio.

   Use your own files, e.g. src: "images/forest.jpg"
   The placeholders below (ph) can be deleted.
   ========================================================= */
const works = [
    { title: "Judge Dredd",  link: "#", src: "images/grid/dredd.jpg", hover: "images/grid/dredd2.jpg", ratio: "4 / 6" },
    { title: "Ruthless Villain",   link: "#", src: "images/grid/mcren.jpg", hover: ph("#f2c6b4", "MC Ren"), ratio: "4 / 6" },
  { title: "Fab Five Fennec",   link: "#", src: "images/grid/nwa.jpg", hover: "images/grid/nwa2.jpg", ratio: "1 / 1" },
  { title: "Champ19ns",  link: "#", src: "images/grid/champ19ns.jpg", hover:  "images/grid/champ19ns2.jpg", ratio: "4 / 2.8" },
    { title: "Ice-T",   link: "#", src: "images/grid/icet.jpg", hover: "images/grid/icet2.jpg", ratio: "4 / 6" },
      { title: "Souness",  link: "#", src: "images/grid/souness.jpg", hover: ph("#c3c9ef", "Graeme Souness"), ratio: "4 / 6" },


      { title: "Alison Becker",  link: "#", src: "images/grid/becker.jpg", hover: ph("#c3c9ef", "5b"), ratio: "4 / 4" },
    { title: "Roberto Baggio", link: "#", src: "images/grid/baggio.jpg", hover: "images/grid/baggio2.jpg", ratio: "4 / 2.8" },
  { title: "Iron Mike",  link: "#", src: "images/grid/tyson.jpg", hover: "images/grid/tyson2.jpg", ratio: "4 / 4" },
  { title: "Firmino",   link: "#", src: "images/grid/bobby.jpg", hover: ph("#f0b9a0", "6b"), ratio: "4 / 2.8" },
    { title: "Cantona",  link: "#", src: "images/grid/seagulls.jpg", hover: ph("#c3c9ef", "5b"), ratio: "4 / 4" },
    { title: "Superman",   link: "#", src: "images/grid/supes.png", hover: ph("#f2c6b4", "1b"), ratio: "4 / 5" },
     { title: "Max",  link: "#", src: "images/grid/st.jpg", hover: "images/grid/max2.jpg", ratio: "4 / 4" },
          { title: "Arnie",  link: "#", src: "images/grid/arnie.jpg", hover: "images/grid/pk2.jpg", ratio: "4 / 4" },
            { title: "Virgil", link: "#", src: "images/grid/virgil.jpg", hover: ph("#dcd09a", "7b"), ratio: "4 / 6" },
      { title: "Joao Pedro",  link: "#", src: "images/grid/joao.jpg", hover: "images/grid/joao2.jpg", ratio: "4 / 4" },

    { title: "Big L",  link: "#", src: "images/grid/king.jpg", hover: "images/grid/king2.jpg", ratio: "4 / 4" },
              { title: "Rap Legends",  link: "#", src: "images/grid/rappers.jpg", hover: "images/grid/pk2.jpg", ratio: "4 / 2.8" },
   
  { title: "Maradona", link: "#", src: "images/grid/diego.jpg", hover: "images/grid/diego2.jpg", ratio: "6 / 6" },
    { title: "Zlatan Imbrahimovic",   link: "#", src: "images/grid/zlatan.jpg", hover: "images/grid/zlatan2.jpg", ratio: "4 / 5" },
     { title: "Klopp crest",  link: "#", src: "images/grid/klopp.jpg", hover: "images/grid/klopp2.jpg", ratio: "4 / 4" },
   { title: "Champions of Europe",  link: "#", src: "images/grid/eurochamps.jpg", hover: "images/grid/eurochamps2.jpg", ratio: "4 / 2.8" },
        { title: "NWA",  link: "#", src: "images/grid/attitude.jpg", hover: "images/grid/attitude2.jpg", ratio: "4 / 4" },
      { title: "Snoop Dogg",  link: "#", src: "images/grid/snoop1.jpg", hover: "images/grid/snoop2.jpg", ratio: "2 / 2" },
    { title: "The online Football fan",  link: "#", src: "images/grid/pk.jpg", hover: "images/grid/pk2.jpg", ratio: "4 / 2.8" },
      { title: "Dustin",   link: "#", src: "images/grid/st2.jpg", hover:"images/grid/st22.jpg", ratio: "4 / 5" },
        { title: "Steve - Upside down",  link: "#", src: "images/grid/st3.jpg", hover:  "images/grid/st32.jpg", ratio: "4 / 4" },
];

/* ---------- Rendering (no need to edit below) ---------- */
const grid = document.getElementById("grid");

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// A link is only real if it's not empty or "#"
function hasLink(l) {
  return typeof l === "string" && l.trim() !== "" && l.trim() !== "#";
}

grid.innerHTML = works.map(w => {
  const inner = `
      <div class="frame" style="--ratio:${esc(w.ratio || "4 / 5")}">
        <img src="${esc(w.src)}" alt="${esc(w.title)}" loading="lazy" draggable="false">
        <img class="alt" src="${esc(w.hover)}" alt="" loading="lazy" draggable="false">
      </div>
      <h2>${esc(w.title)}</h2>`;

  return hasLink(w.link)
    ? `<article class="work"><a href="${esc(w.link)}">${inner}</a></article>`
    : `<article class="work"><div class="no-link">${inner}</div></article>`;
}).join("");

/* ---------- Back to top button ---------- */
const toTop = document.getElementById("toTop");

function updateToTop() {
  toTop.classList.toggle("visible", window.scrollY > 400);
}

window.addEventListener("scroll", updateToTop, { passive: true });
updateToTop();

toTop.addEventListener("click", () => {
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  window.scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" });
});

/* ---------- Layout switch ---------- */
const buttons = document.querySelectorAll(".switch button");

function setLayout(layout) {
  grid.dataset.layout = layout;
  buttons.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.layout === layout)));
  try { localStorage.setItem("portfolio-layout", layout); } catch (e) {}
}

buttons.forEach(b => b.addEventListener("click", () => setLayout(b.dataset.layout)));

// Remember the visitor's last choice
try {
  const saved = localStorage.getItem("portfolio-layout");
  if (saved === "offgrid" || saved === "mosaic") setLayout(saved);
} catch (e) {}

/* Placeholder image generator, used only for the sample entries */
function ph(color, label) {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500"><rect width="400" height="500" fill="${color}"/><text x="200" y="260" font-family="sans-serif" font-size="64" text-anchor="middle" fill="rgba(0,0,0,.35)">${label}</text></svg>`;
  return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
}
</script>
</body>
</html>
